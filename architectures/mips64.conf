ARCH_ID=mips64
ARCH_ALIASES='mips64eb'
ARCH_STATUS=experimental
ARCH_FAMILY=mips
ARCH_BITS=64
ARCH_ENDIAN=big
ARCH_ABI=n64
KERNEL_ARCH=mips
KERNEL_DEFCONFIG=malta_defconfig
KERNEL_IMAGE=vmlinux
KERNEL_MIN_VERSION=2.6
LINUX_CONSOLE=ttyS0
LINUX_CONTROL_TTY=/dev/ttyS1
QEMU_BINARY=qemu-system-mips64
QEMU_MACHINE=malta
QEMU_CONTROL_MODE=serial
QEMU_TCG_CPU=I6400
TOOLCHAIN_TARGET=mips64-linux
BUILDROOT_DEFCONFIG=qemu_mips64_malta_defconfig
BUSYBOX_FILE_MATCH='MIPS64.*MSB|MIPS.*64.*MSB'
KVM_HOSTS=''
DEBIAN_ARCH=mips64
RPM_ARCH=mips64
APK_ARCH=mips64
GUEST_UNAME_MACHINE='mips64'
E2E_STATUS=experimental
