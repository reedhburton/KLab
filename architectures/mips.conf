ARCH_ID=mips
ARCH_ALIASES='mips32 mipseb'
ARCH_STATUS=experimental
ARCH_FAMILY=mips
ARCH_BITS=32
ARCH_ENDIAN=big
ARCH_ABI=o32
KERNEL_ARCH=mips
KERNEL_DEFCONFIG=malta_defconfig
KERNEL_IMAGE=vmlinux
KERNEL_MIN_VERSION=2.6
LINUX_CONSOLE=ttyS0
LINUX_CONTROL_TTY=/dev/ttyS1
QEMU_BINARY=qemu-system-mips
QEMU_MACHINE=malta
QEMU_NET_DEVICE=pcnet
QEMU_CONTROL_MODE=serial
QEMU_TCG_CPU=24Kf
QEMU_MEMORY=256M
QEMU_CPUS=1
TOOLCHAIN_TARGET=mips-linux
BUILDROOT_DEFCONFIG=qemu_mips32r2_malta_defconfig
BUSYBOX_FILE_MATCH='ELF 32-bit MSB.*MIPS|MIPS.*big.endian'
FILE_MATCH_REJECT='MIPS64|LSB'
KVM_HOSTS=''
DEBIAN_ARCH=mips
RPM_ARCH=mips
APK_ARCH=mips
GUEST_UNAME_MACHINE='mips'
KERNEL_CONFIG_ENABLE='CPU_BIG_ENDIAN SERIAL_8250 SERIAL_8250_CONSOLE NET INET PACKET UNIX NETDEVICES ETHERNET PCNET32'
KERNEL_CONFIG_DISABLE='CPU_LITTLE_ENDIAN'
E2E_STATUS=experimental
E2E_DEFAULT_VERSIONS='v4.14 v5.4 v5.15 v6.1 v6.6 v6.12 v7.0'
